name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      BLOTATO_DRY_RUN: "1"
      POSTDECK_WORKER: "0"
      POSTDECK_SYNC_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm test
